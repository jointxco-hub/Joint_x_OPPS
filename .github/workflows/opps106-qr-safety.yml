name: OPPS-106 QR safety tests
on:
  push:
    branches:
      - feature/106-cafe-visibility-qr
  pull_request:
    paths:
      - 'src/features/cafeQr/**'
      - 'src/api/cafeCounterQr.js'
      - 'src/pages/CafeQrSandbox.jsx'
      - 'src/server/cafeQr/**'
      - 'tests/issue-106-*.test.mjs'
      - 'tests/opps106-counter-race-postgres.sh'
      - 'tests/fixtures/opps106-counter-race-postgres.sql'
      - 'supabase/staging-only/20261118_opps106_manual_counter_qr_concurrency.sql'
      - '.github/workflows/opps106-qr-safety.yml'
permissions:
  contents: read
jobs:
  qr-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: QR presentation, staff URL and PayFast correlation tests
        run: |
          node --version
          node --test tests/issue-106-qr-presentation.test.mjs tests/issue-106-qr-staff-ui.test.mjs tests/issue-106-payfast-qr-correlation.test.mjs tests/issue-106-qr-scan-uuid.test.mjs tests/issue-106-qr-notify-uuid.test.mjs tests/issue-106-qr-return.test.mjs tests/issue-106-qr-return-relay.test.mjs tests/issue-106-qr-itn-multipart.test.mjs tests/issue-106-qr-handoff-ui.test.mjs tests/issue-106-gateway-environment-provenance.test.mjs tests/issue-106-manual-counter-concurrency.test.mjs tests/issue-106-unresolved-qr-review.test.mjs tests/issue-106-live-release-gate.test.mjs tests/issue-106-gateway-environment-contract.test.mjs tests/issue-106-bound-checkout-settlement.test.mjs

  postgres-counter-race:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opps106_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opps106_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run two-session payment and QR lock tests (disposable only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: opps106_disposable
        run: bash tests/opps106-counter-race-postgres.sh
